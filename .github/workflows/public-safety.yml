name: Public safety

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  privacy-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Scan files and new commit metadata
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ -n "${BASE_SHA}" ]] &&
             [[ ! "${BASE_SHA}" =~ ^0+$ ]] &&
             git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            commit_range="${BASE_SHA}..${HEAD_SHA}"
          elif git rev-parse "${HEAD_SHA}^" >/dev/null 2>&1; then
            commit_range="${HEAD_SHA}^..${HEAD_SHA}"
          else
            commit_range="${HEAD_SHA}"
          fi
          python3 scripts/check_public_safety.py --commit-range "${commit_range}"
